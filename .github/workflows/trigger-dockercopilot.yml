name: Trigger dockerCopilot workflow

permissions:
  contents: read

on:
  push:
    branches:
      - master   # React 仓库主分支

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger autunn dockerCopilot GHCR latest
        env:
          GH_TOKEN: ${{ secrets.DOCKER_COPILOT_TRIGGER_TOKEN }}
          FRONTEND_REF: ${{ github.sha }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "Missing DOCKER_COPILOT_TRIGGER_TOKEN" >&2
            exit 1
          fi
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/autunn/dockerCopilot/actions/workflows/ghcr-latest.yml/dispatches \
            -d '{
              "ref": "latest",
              "inputs": {
                "frontend_ref": "'"${FRONTEND_REF}"'"
              }
            }'
